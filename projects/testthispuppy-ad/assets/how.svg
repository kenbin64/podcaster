<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#14263a"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#g)"/><rect x="0" y="0" width="18" height="900" fill="#2dd4bf"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="120" y="150" font-size="40" letter-spacing="6" fill="#7fe0c4">ONE RUN, FOUR CHECKS</text>
<rect x="120" y="210" width="650" height="270" rx="22" fill="#16304a" stroke="#2dd4bf" stroke-width="3"/>
<text x="160" y="300" font-size="50" font-weight="700" fill="#ffffff">1  Runs your real app</text>
<text x="160" y="370" font-size="32" fill="#a9bccf">clicks and types like a person</text><text x="160" y="420" font-size="32" fill="#a9bccf">(Selenium WebDriver, HTTP)</text>
<rect x="830" y="210" width="650" height="270" rx="22" fill="#16304a" stroke="#2dd4bf" stroke-width="3"/>
<text x="870" y="300" font-size="50" font-weight="700" fill="#ffffff">2  Throwaway database</text>
<text x="870" y="370" font-size="32" fill="#a9bccf">a real copy in Docker, then</text><text x="870" y="420" font-size="32" fill="#a9bccf">everything restored exactly</text>
<rect x="120" y="530" width="650" height="270" rx="22" fill="#16304a" stroke="#2dd4bf" stroke-width="3"/>
<text x="160" y="620" font-size="50" font-weight="700" fill="#ffffff">3  Tests your tests</text>
<text x="160" y="690" font-size="32" fill="#a9bccf">plants bugs to see if your</text><text x="160" y="740" font-size="32" fill="#a9bccf">tests notice (mutation testing)</text>
<rect x="830" y="530" width="650" height="270" rx="22" fill="#16304a" stroke="#2dd4bf" stroke-width="3"/>
<text x="870" y="620" font-size="50" font-weight="700" fill="#ffffff">4  Checks the code</text>
<text x="870" y="690" font-size="32" fill="#a9bccf">code rules and known-vulnerable</text><text x="870" y="740" font-size="32" fill="#a9bccf">libraries, with a fix list</text>
</g>
</svg>
