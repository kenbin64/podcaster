<rect x="140" y="1320" width="800" height="150" rx="24" fill="#16304a" stroke="#2dd4bf" stroke-width="5"/>
<text x="540" y="1415" font-size="52" font-weight="700" fill="#2dd4bf">butterflyfx.us/studio</text>
