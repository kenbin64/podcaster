<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#14263a"/></linearGradient></defs>
<rect width="1080" height="1920" fill="url(#g)"/><rect x="0" y="0" width="1080" height="16" fill="#2dd4bf"/>
<g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
<text x="540" y="560" font-size="96" font-weight="800" fill="#ffffff">No post-production.</text>
<text x="540" y="700" font-size="58" fill="#e6edf3">Stop talking, tap save.</text>
<g font-size="46" fill="#e6edf3" text-anchor="start">
<text x="200" y="900">1  Script in a Google Doc</text>
<text x="200" y="990">2  Read it off the screen</text>
<text x="200" y="1080">3  Graphics appear on cue</text>
