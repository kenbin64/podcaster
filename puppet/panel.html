<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talking panel demo</title>
<style>
  :root { --bg: #0b0d12; --ink: #e6edf3; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, Segoe UI, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  canvas { width: 100%; height: auto; aspect-ratio: 16 / 9; display: block; border-radius: 10px; background: #000; }
  button { font: inherit; margin-top: 12px; padding: 8px 16px; border-radius: 8px; border: 0; background: #2dd4bf; color: #062a26; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <canvas id="stage" width="1920" height="1080"></canvas>
  <button id="play" type="button">Play</button>
</main>
<script type="module">
// Plays demo/panel.json: several people at one desk, each line in its speaker's voice, one after another.
// A line with word timings (a typed line) moves the mouth from its letters; a recorded line moves it from the sound.
// Everyone not speaking listens: eyes and head toward the speaker.
import { direct } from './director.js';
import { createRig } from './rig.js';
import { drawBody, drawHands, LOOKS, place } from './character.js';
import { cameraAt, drawBack, drawDesk, drawFront } from './scene.js';
import { analyseVoice } from './voice.js';

const GAP_MS = 350, LEAD_MS = 400, CAPTION_MS = 5500;
const canvas = document.getElementById('stage'), ctx = canvas.getContext('2d');
// ?manifest=<path to an episode's voices/cast.json> plays what the studio's "Voice the cast" made; otherwise the demo.
const manifest = new URLSearchParams(location.search).get('manifest');
const panel = await (await fetch(manifest ? '/abs?path=' + encodeURIComponent(manifest) : 'demo/panel.json')).json();
const audioUrl = (a) => (/^([a-z]:|\/)/i.test(a) ? '/abs?path=' + encodeURIComponent(a) : 'demo/' + a);
const captions = [];   // {text pos | words} cues from the script, as lower-third captions
const audioCtx = new AudioContext();

// Seats spread evenly across the desk, sized so everyone fits.
const n = panel.cast.length, size = n === 1 ? 1 : n === 2 ? 0.8 : 0.62;
const seats = panel.cast.map((c, i) => ({ x: 1920 * (i + 0.5) / n, s: size }));

// Lay the lines out in time and give each person their words, mouth frames and listening spans.
const people = panel.cast.map((c, i) => ({ ...c, seat: seats[i], words: [], notes: [], mouthFrames: [], listen: [] }));
const byName = Object.fromEntries(people.map((p) => [p.name, p]));
const clips = [];
let t = LEAD_MS;
for (const line of panel.lines) {
  const buffer = await audioCtx.decodeAudioData(await (await fetch(audioUrl(line.audio))).arrayBuffer());
  const who = byName[line.who], start = t;
  let words = line.words;
  if (!words) {                                   // a recording: the sound gives the mouth and the beats
    const heard = analyseVoice(buffer);
    words = heard.words;
    for (const f of heard.frames) who.mouthFrames.push({ ...f, t: f.t + start });
    who.mouthFrames.push({ t: start + heard.durationMs, open: 0, wide: 0.5, round: 0 });
  }
  for (const note of line.notes) who.notes.push({ at: who.words.length + note.at, note: note.note });
  for (const w of words) who.words.push({ ...w, start: w.start + start, end: w.end + start });
  const end = start + buffer.duration * 1000;
  for (const c of line.cues || []) {               // a caption appears as its word is spoken
    const m = c.cue.match(/^\{\s*text\b[^|]*\|(.*)\}$/i);
    if (!m) continue;
    const w = words[c.at];
    captions.push({ t: w ? w.start + start : start, text: m[1].trim() });
  }
  for (const other of people) if (other !== who) other.listen.push({ start, end, dir: Math.sign(who.seat.x - other.seat.x) });
  clips.push({ buffer, start });
  t = end + GAP_MS;
}
const totalMs = t + 600;
people.forEach((p, i) => { p.targetsAt = direct(p.words, p.notes, 7 + i * 13, { mouthFrames: p.mouthFrames, listen: p.listen }); p.rig = createRig(); p.look = LOOKS[p.look] || LOOKS.host; });

// Draws the whole stage at time t (seconds), having moved dt seconds since the last frame.
function render(t, dt) {
  const poses = people.map((p) => p.rig.update(p.targetsAt(t * 1000), dt, t));
  const cam = cameraAt(t, { headTurn: 0 });
  ctx.clearRect(0, 0, 1920, 1080);
  drawBack(ctx, cam, t);
  people.forEach((p, i) => { ctx.save(); ctx.translate(cam.x * 0.75, cam.y * 0.75); place(ctx, p.seat); drawBody(ctx, poses[i], p.look); ctx.restore(); });
  drawDesk(ctx, cam, false);
  people.forEach((p, i) => { ctx.save(); ctx.translate(cam.x, cam.y); place(ctx, p.seat); drawHands(ctx, poses[i], p.look); ctx.restore(); });
  drawFront(ctx, cam, seats, place);
  drawCaption(t * 1000);
}

// The latest caption, for a few seconds, in a lower-third bar that slides and fades in.
captions.sort((a, b) => a.t - b.t);
function drawCaption(ms) {
  let c = null; for (const x of captions) { if (x.t <= ms) c = x; else break; }
  if (!c || ms - c.t > CAPTION_MS) return;
  const age = ms - c.t, k = Math.min(1, age / 250) * Math.min(1, (CAPTION_MS - age) / 300);
  ctx.save(); ctx.globalAlpha = k; ctx.font = '600 46px system-ui, Segoe UI, sans-serif';
  const w = ctx.measureText(c.text).width + 80, x = 70 - (1 - k) * 40, y = 950;
  ctx.fillStyle = 'rgba(8,10,16,0.82)'; ctx.beginPath(); ctx.roundRect(x, y, w, 82, 14); ctx.fill();
  ctx.fillStyle = '#2dd4bf'; ctx.fillRect(x, y, 10, 82);
  ctx.fillStyle = '#f2f5f8'; ctx.textBaseline = 'middle'; ctx.fillText(c.text, x + 44, y + 43);
  ctx.restore();
}

// For checking: settle every rig at time t by stepping up to it, then draw.
window.renderAt = (t) => { for (let s = Math.max(0, t - 1.5); s < t; s += 1 / 60) render(s, 1 / 60); render(t, 1 / 60); };
window.timeline = { totalMs, lines: clips.map((c, i) => ({ who: panel.lines[i].who, start: c.start, ms: Math.round(c.buffer.duration * 1000) })) };

// Plays the panel from the start; resolves when it ends. With record set, also returns the recording.
window.play = async (record = false) => {
  const dest = audioCtx.createMediaStreamDestination();
  let recorder = null; const chunks = [];
  if (record) {
    const stream = canvas.captureStream(30); stream.addTrack(dest.stream.getAudioTracks()[0]);
    recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9,opus', videoBitsPerSecond: 3000000, videoKeyFrameIntervalDuration: 2000 });
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); }; recorder.start(1000);
  }
  const t0 = audioCtx.currentTime + 0.1;
  for (const c of clips) { const src = audioCtx.createBufferSource(); src.buffer = c.buffer; src.connect(audioCtx.destination); src.connect(dest); src.start(t0 + c.start / 1000); }
  let last = t0;
  await new Promise((done) => { (function frame() {
    const now = audioCtx.currentTime, t = Math.max(0, now - t0);
    render(t, Math.min(0.05, Math.max(0, now - last))); last = Math.max(last, now);
    if (t < totalMs / 1000) requestAnimationFrame(frame); else done();
  })(); });
  if (!recorder) return null;
  recorder.stop(); await new Promise((r) => recorder.addEventListener('stop', r, { once: true }));
  return { blob: new Blob(chunks, { type: 'video/webm' }), seconds: audioCtx.currentTime - t0 };
};

document.getElementById('play').addEventListener('click', async () => { await audioCtx.resume(); window.play(false); });
window.renderAt(0.5);
window.ready = true;
</script>
</body>
</html>
